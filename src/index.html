<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <div
      class="search-wrapper"
      data-qa="big"
    >
      <div class="input-container big-input">
        <img
          src="images/Search.svg"
          alt="search"
          class="search-icon"
        />
        <input
          type="text"
          data-qa="keypress"
          placeholder="Try “Los Angeles”"
        />
      </div>
    </div>

    <div
      class="search-wrapper"
      data-qa="small"
    >
      <div class="input-container small-input">
        <img
          src="images/Search.svg"
          alt="search"
          class="search-icon"
        />
        <input
          type="text"
          placeholder="Try “Los Angeles”"
        />
      </div>
    </div>
  </body>
</html>
